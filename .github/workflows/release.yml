name: release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck
      - name: Validate release
        run: |
          shellcheck -s bash -x get-lemper scripts/build_release.sh lib/core/*.sh lib/lemper-stack.sh
          bats tests/ tests/unit/
      - name: Build archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build_release.sh "${RELEASE_TAG#v}" "${RUNNER_TEMP}/lemper-release"
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" --verify-tag --generate-notes "${RUNNER_TEMP}"/lemper-release/*
