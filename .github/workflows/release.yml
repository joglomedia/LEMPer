name: release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Install checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats curl python3-pip
          sudo pip3 install --break-system-packages bashate
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o /tmp/shellcheck.tar.xz
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: Validate release
        run: |
          shellcheck -s bash -x get-lemper install.sh remove.sh update.sh lemper.sh bin/lemper-cli.sh \
            scripts/*.sh scripts/nginx/*.sh lib/lemper-*.sh lib/core/*.sh \
            lib/runtime/*.sh lib/runtime/*/*.sh lib/services/*.sh lib/services/*/*.sh lib/compat/*.sh tests/uat/*.sh
          bashate --ignore E001,E002,E003,E006,E010,E011,E012,E020,E042,E043,E044,E045 --max-line-length 120 \
            get-lemper install.sh remove.sh update.sh lemper.sh bin/lemper-cli.sh \
            scripts/*.sh scripts/nginx/*.sh lib/lemper-*.sh lib/core/*.sh \
            lib/runtime/*.sh lib/runtime/*/*.sh lib/services/*.sh lib/services/*/*.sh lib/compat/*.sh tests/uat/*.sh
          bats tests/ tests/unit/
      - name: Build archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build_release.sh "${RELEASE_TAG#v}" "${RUNNER_TEMP}/lemper-release"
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" --verify-tag --generate-notes "${RUNNER_TEMP}"/lemper-release/*
