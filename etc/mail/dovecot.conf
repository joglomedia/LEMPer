# Managed by LEMPer. Account/domain maps are changed with lemperctl mail.
protocols = imap lmtp
listen = *, ::
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = <@CERT@/fullchain.pem
ssl_key = <@CERT@/privkey.pem
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu
auth_username_chars = abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_@+
recipient_delimiter =
auth_cache_size = 0
mail_location = maildir:@HOME@/%d/%n/Maildir
first_valid_uid = @UID@
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u @ROOT@/current/passwd
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=@HOME@/%d/%n
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
protocol lmtp {
  postmaster_address = postmaster@@DOMAIN@
}
