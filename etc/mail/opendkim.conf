# Managed by LEMPer. Keys are retained when domains are removed and re-added.
Syslog yes
UMask 007
UserID opendkim
Socket inet:8891@127.0.0.1
PidFile /run/opendkim/opendkim.pid
Canonicalization relaxed/relaxed
Mode sv
OversignHeaders From
KeyTable file:@ROOT@/current/key.table
SigningTable refile:@ROOT@/current/signing.table
InternalHosts 127.0.0.1,::1
ExternalIgnoreList 127.0.0.1,::1
