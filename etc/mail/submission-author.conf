# A dedicated Rspamd worker for the authenticated submission policy.
lua = "@ROOT@/submission-author.lua";
options {
    filters = "";
    check_all_filters = false;
    soft_reject_on_timeout = true;
    dns { nameserver = "127.0.0.1"; }
    url_tld = "${SHAREDIR}/effective_tld_names.dat";
    pidfile = "/run/lemper-mail-author/rspamd.pid";
    control_socket = "/run/lemper-mail-author/control.sock mode=0600";
}
logging {
    type = console;
    level = warning;
}
actions {
    reject = 100;
}
group "lemper-submission" {
    symbols { "LEMPER_SUBMISSION_AUTHOR" { weight = 0; } }
}
worker "rspamd_proxy" {
    bind_socket = "/var/spool/postfix/lemper-mail-author/filter.sock mode=0660";
    count = 1;
    milter = true;
    timeout = 30s;
    upstream "local" {
        self_scan = true;
    }
}
