# Managed by LEMPer. Dovecot 2.4 uses a dedicated versioned configuration.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols {
  imap = yes
  lmtp = yes
}
listen = *, ::
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = @CERT@/fullchain.pem
ssl_server_key_file = @CERT@/privkey.pem
auth_allow_cleartext = no
auth_mechanisms = plain login
auth_username_format = %{user | lower}
auth_username_chars = abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_@+
recipient_delimiter =
auth_cache_size = 0
mail_driver = maildir
mail_path = %{home}/Maildir
first_valid_uid = @UID@
passdb passwd-file {
  default_password_scheme = SHA512-CRYPT
  passwd_file_path = @ROOT@/current/passwd
}
userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = @HOME@/%{user | domain}/%{user | username}
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
protocol lmtp {
  postmaster_address = postmaster@@DOMAIN@
}
