# Full vhost template for verified Mautic/Roundcube complete packages.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    root "@ROOT@";
    index index.php index.html;
    client_max_body_size 50m;
    disable_symlinks if_not_owner;
    access_log /var/log/nginx/@DOMAIN@.access.log lp_cache buffer=32k flush=5s;
    error_log /var/log/nginx/@DOMAIN@.error.log error;
    include /etc/nginx/site-apps/@DOMAIN@/*.conf;

    # SSL configuration is managed through the normal site commands.
    #ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    #ssl_trusted_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    #include /etc/nginx/includes/ssl.conf;
    include /etc/nginx/includes/compression_gzip.conf;
    include /etc/nginx/includes/rules_security.conf;
    # Bundled Mautic images are public; other app/ paths retain the deny rule.
    location ~ ^/app/assets/images/[A-Za-z0-9_/-]+\.(ico|png|jpg|jpeg|gif|svg)$ {
        try_files $uri =404;
    }
    include /etc/nginx/includes/rules_restriction.conf;

    # Setup is available through loopback/SSH tunneling, not public registration.
    location ~ @SETUP@ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/@SETUP_SCRIPT@;
        fastcgi_param SCRIPT_NAME /@SETUP_SCRIPT@;
        include /etc/nginx/includes/fastcgi.conf;
        fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
    }
    # Execute only the upstream public entry scripts.
    location ~ ^/(@ENTRIES@)\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        try_files $fastcgi_script_name =404;
        include /etc/nginx/fastcgi_params;
        include /etc/nginx/includes/fastcgi.conf;
        fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
    }
    location ~ \.php(/|$) { return 404; }
    location ~* ^/(vendor|config|var|bin|logs|temp|translations|utils|patches|templates|SQL)(/|$) { return 404; }
    include /etc/nginx/includes/rules_staticfiles.conf;
    include /etc/nginx/vhost/site_@TYPE@.conf;
}
