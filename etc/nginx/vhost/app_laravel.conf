# LEMPer managed Laravel mount: @MOUNT@. Only the public front controller executes.
location = @MOUNT@ {
    return 308 @MOUNT@/$is_args$args;
}
location = @MOUNT@/index.php {
    root "@PUBLIC@";
    try_files /index.php =404;
    fastcgi_pass unix:@SOCKET@;
    include /etc/nginx/includes/fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME "@PUBLIC@/index.php";
    fastcgi_param SCRIPT_NAME @MOUNT@/index.php;
    fastcgi_param DOCUMENT_ROOT "@PUBLIC@";
    fastcgi_param PATH_INFO "";
    fastcgi_param HTTPS $server_https;
    fastcgi_param HTTP_X_FORWARDED_PROTO $proto_https;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param DOCUMENT_URI $document_uri;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param GATEWAY_INTERFACE CGI/1.1;
    fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param REMOTE_PORT $remote_port;
    fastcgi_param SERVER_ADDR $server_addr;
    fastcgi_param SERVER_PORT $server_port;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param REDIRECT_STATUS 200;
}
location ^~ @MOUNT@/ {
    alias "@PUBLIC@/";
    index index.php index.html;
    # ^~ bypasses the parent regex locations, so apply restrictions here too.
    include /etc/nginx/includes/rules_restriction.conf;
    location ~* \.(?:php[0-9]*|phtml|phar)(?:/|$) {
        return 404;
    }
    set $lemper_app_redirect "";
    if ($uri ~ "^(@MOUNT@/.*)/$") {
        set $lemper_app_redirect $1;
    }
    if (-d $request_filename) {
        set $lemper_app_redirect "";
    }
    if ($lemper_app_redirect != "") {
        return 308 $lemper_app_redirect$is_args$args;
    }
    try_files $uri $uri/ @lemper_app_@NAME@;
}
location @lemper_app_@NAME@ {
    rewrite ^@MOUNT@/ /@NAME@/index.php last;
}
