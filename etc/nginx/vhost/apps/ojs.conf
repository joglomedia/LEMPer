# Issue #35; preserve PATH_INFO and keep submission storage private.
location ~ ^/(lib|plugins|styles|js|cache)/(?!\.)(?!.*\/\.)[A-Za-z0-9_./-]+\.(css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff2?|ttf)$ {
    try_files $uri =404;
}
location ~ ^/(cache/|lib/|classes/|controllers/|dbscripts/|docs/|tools/|templates/|locale/|config\.inc\.php) { return 404; }
include /etc/nginx/includes/rules_restriction.conf;
location ~ ^/index\.php/[^/]+/install(?:/|$) {
    allow 127.0.0.1; allow ::1; deny all;
    include /etc/nginx/fastcgi_params;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    include /etc/nginx/includes/fastcgi.conf;
    fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
}
location / { try_files $uri $uri/ /index.php?$query_string; }
location ~ ^/index\.php(?:/|$) {
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $saved_path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param PATH_INFO $saved_path_info;
    include /etc/nginx/includes/fastcgi.conf;
    fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
}
location ~ \.php(?:/|$) { return 404; }
include /etc/nginx/includes/rules_staticfiles.conf;
