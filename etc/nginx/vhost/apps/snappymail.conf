# https://github.com/the-djmaze/snappymail/wiki/Installation-instructions
location ^~ /data/ { return 404; }
location ~ ^/snappymail/v/[^/]+/(app/|include\.php) { return 404; }
include /etc/nginx/includes/rules_restriction.conf;
location / { try_files $uri $uri/ /index.php?$query_string; }
location = /index.php {
    include /etc/nginx/fastcgi_params;
    include /etc/nginx/includes/fastcgi.conf;
    fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
}
location ~ \.php(?:/|$) { return 404; }
include /etc/nginx/includes/rules_staticfiles.conf;
