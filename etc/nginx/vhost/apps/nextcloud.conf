# Adapted from Nextcloud's official root-install Nginx configuration.
# The backend always uses this site's Unix FPM socket.
client_body_timeout 300s;
client_body_buffer_size 512k;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-Robots-Tag "noindex, nofollow" always;
fastcgi_hide_header X-Powered-By;
include /etc/nginx/mime.types;
@EXTRA_MIME@
# Fresh setup remains private until the administrator explicitly publishes it.
set $setup_blocked 0;
if (-f $document_root/.lemper-setup-pending) { set $setup_blocked 1; }
if ($remote_addr = 127.0.0.1) { set $setup_blocked 0; }
if ($remote_addr = ::1) { set $setup_blocked 0; }
if ($setup_blocked = 1) { return 403; }
index index.php index.html /index.php$request_uri;
location = / {
    if ($http_user_agent ~ ^DavClnt) { return 302 /remote.php/webdav/$is_args$args; }
}
location = /robots.txt { allow all; log_not_found off; access_log off; }
location ^~ /.well-known {
    location = /.well-known/carddav { return 301 /remote.php/dav/; }
    location = /.well-known/caldav { return 301 /remote.php/dav/; }
    location /.well-known/acme-challenge { try_files $uri $uri/ =404; }
    location /.well-known/pki-validation { try_files $uri $uri/ =404; }
    return 301 /index.php$request_uri;
}
location ~ ^/(build|tests|config|lib|3rdparty|templates|data)(/|$) { return 404; }
location ~ ^/(\.|autotest|occ|issue|indie|db_|console) { return 404; }
location ~ ^/(composer\.(json|lock)|package(-lock)?\.json|core/shipped\.json)$ { return 404; }
location ~ \.php(?:$|/) {
    rewrite ^/(?!index|remote|public|cron|status|ocs/v[12]|ocs-provider/.+|core/ajax/update|updater/.+|.+/richdocumentscode(_arm64)?/proxy) /index.php$request_uri;
    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $saved_path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $saved_path_info;
    fastcgi_param modHeadersAvailable true;
    fastcgi_param front_controller_active true;
    fastcgi_param HTTP_HOST $http_host;
    include /etc/nginx/includes/fastcgi.conf;
    fastcgi_request_buffering on;
    fastcgi_max_temp_file_size 0;
    fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
}
location ~ \.(css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac|mp4|webm)$ {
    try_files $uri /index.php$request_uri;
    expires 6M;
    access_log off;
}
location ~ \.(otf|woff2?)$ { try_files $uri /index.php$request_uri; expires 7d; access_log off; }
location /remote { return 301 /remote.php$request_uri; }
location / { try_files $uri $uri/ /index.php$request_uri; }
