# Issue #149; https://docs.xenforo.com/manual/configuration/options-list/friendly-urls
location ^~ /internal_data/ { return 404; }
location ^~ /src/ { return 404; }
location ^~ /library/ { return 404; }
location ^~ /install/data/ { return 404; }
location ^~ /install/templates/ { return 404; }
include /etc/nginx/includes/rules_restriction.conf;
location ~ ^/install(?:/index\.php)?/?$ {
    allow 127.0.0.1; allow ::1; deny all;
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/install/index.php;
    include /etc/nginx/includes/fastcgi.conf;
    fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
}
location / { try_files $uri $uri/ /index.php?$uri&$args; }
location ~ ^/(index|admin|css|js|job|proxy|payment_callback|connected_account|api/index)\.php$ {
    try_files $uri =404;
    include /etc/nginx/fastcgi_params;
    include /etc/nginx/includes/fastcgi.conf;
    fastcgi_pass unix:/run/php/php@PHP@-fpm.@OWNER@.sock;
}
location ~ \.php(?:/|$) { return 404; }
include /etc/nginx/includes/rules_staticfiles.conf;
