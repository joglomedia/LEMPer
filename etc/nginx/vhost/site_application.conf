# Full vhost for application-specific routing and Unix-socket PHP.
server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    root "@ROOT@";
    @INDEX@
    client_max_body_size 512m;
    access_log /home/@OWNER@/logs/nginx/access_log lp_cache buffer=32k;
    error_log /home/@OWNER@/logs/nginx/error_log error;
    include /etc/nginx/site-apps/@DOMAIN@/*.conf;
    #ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
    #ssl_trusted_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    #include /etc/nginx/includes/ssl.conf;
    include /etc/nginx/includes/compression_gzip.conf;
    @SECURITY@
    @APP_RULES@
}
