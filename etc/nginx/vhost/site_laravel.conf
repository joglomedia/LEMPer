## Laravel PHP Frameworks rewrite rules.
# Designed to be included in any server {} block.

location / {
    # Canonicalize routes while keeping real directory URLs and HTTP methods.
    # Nginx escapes decoded URI captures when composing the redirect.
    set $lemper_laravel_redirect "";
    if ($uri ~ "^(/[^/].*)/$") {
        set $lemper_laravel_redirect $1;
    }
    if (-d $request_filename) {
        set $lemper_laravel_redirect "";
    }
    if ($lemper_laravel_redirect != "") {
        return 308 $lemper_laravel_redirect$is_args$args;
    }
    # try to serve file directly, fallback to index.php
    try_files $uri $uri/ /index.php?$query_string;

    # Uncomment to enable naxsi WAF.
    #include /etc/nginx/includes/naxsi.rules

    # Uncomment to enable CORS widely.
    #include /etc/nginx/includes/cors.conf;

    # Enables directory listings when index file not found.
    #autoindex on;

    # Shows file listing times as local time.
    #autoindex_localtime on;
}
