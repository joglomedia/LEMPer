# Generated by LEMPer Stack — low-end VPS profile.
#
# Tuned for servers under 1 GiB RAM (micro profile): single worker, smaller
# buffers and caches, and no asynchronous I/O threads. The installer selects
# this file automatically when SERVER_PROFILE resolves to "micro"; it can also
# be copied manually over /etc/nginx/nginx.conf.
#
# Sizing can be overridden at install time with SERVER_PROFILE and
# PHP_FPM_MAX_CHILDREN in .env.

user www-data;
pid /run/nginx.pid;

# A single worker keeps memory predictable on a small VPS.
worker_processes 1;
worker_rlimit_nofile 16384;

# Load dynamic modules (requires Nginx to be installed from source).
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 512;
    use epoll;
    multi_accept off;
}

http {
    # Hide nginx version information.
    server_tokens off;
    etag off;

    # Override server name, requires headers-more-nginx-module enabled.
    #more_set_headers "Server: LEMPer";

    # Add necessary `lua_package_path` directive, requires lua-nginx-module enabled.
    #lua_package_path "/usr/local/lib/lua/?.lua;;";

    # Default MIME types for files.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Charset.
    include /etc/nginx/charset;

    # Limits request (simple DDoS defense). Uncomment both the zones below and
    # the limit_req/limit_conn lines in includes/rules_security.conf, or set
    # NGINX_RATE_LIMITING=true in .env.
    #limit_req_log_level warn;
    #limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;
    #limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Logging format.
    log_format main '$remote_addr - $remote_user [$time_local] $request '
                '"$status" $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" "$gzip_ratio"'
                ' "$connection" "$connection_requests" "$request_time"';

    # To boost I/O on HDD we can disable access logs by default, should be enabled per vhost.
    access_log off;

    # Default error log, should be configured per vhost with appropriate level.
    error_log /var/log/nginx/error.log warn;

    # Cache informations about FDs, frequently accessed files.
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Optimization settings (no aio threads on micro instances).
    sendfile on;
    # Limit the amount of data transferred in a single sendfile() call.
    sendfile_max_chunk 256k;
    tcp_nopush on;
    tcp_nodelay on;
    client_body_buffer_size 16k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_max_body_size 20m;
    types_hash_max_size 2048;
    variables_hash_bucket_size 128;
    variables_hash_max_size 512;

    # Connection tuning: shorter timeouts free workers sooner.
    reset_timedout_connection on;
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 10s;
    keepalive_timeout 30s;
    keepalive_requests 1000;

    # Enable Compression.
    # gzip (default) or brotli (requires Nginx installed with brotli module).
    # Moved to per site config.
    ##include /etc/nginx/compression_gzip;

    # CORS origin mapping (used by includes/cors.conf).
    include /etc/nginx/cors;

    # Uncomment to enable FastCGI cache. If disabled, do not use the cached vhost setting.
    include /etc/nginx/fastcgi_cache;

    # Uncomment to enable Proxy cache. Enables only if Nginx runs as proxy server.
    #include /etc/nginx/proxy_cache;

    # Upstream, ex: for Node.JS application server.
    ##include /etc/nginx/upstream;

    # SSL map.
    include /etc/nginx/fastcgi_https_map;

    # Let Nginx get the real client IP for its access logs.
    #include /etc/nginx/http_proxy_ips;

    # Uncomment if you're using CloudFlare CDN.
    include /etc/nginx/http_cloudflare_ips;

    # Load vhost configs.
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
