## Global access rules and restriction directives.
# Designed to be included in any server {} block.

# Allow "Well-Known URIs" as per RFC 5785/8615.
location ~ ^/.well-known/ {
    allow all;
    log_not_found off;
}

# Allow "Well-Known URIs" as per RFC 5785/8615.
location ~ ^/.well-known/acme-challenge/ {
    allow all;
    log_not_found off;
}

# Deny access to "hidden" files and directories whose names begin with a
# period. This includes directories used by version control systems such
# as Subversion or Git to store control files, plus .env, .DS_Store and
# editor/backup files.
# The .well-known locations above are matched first, so ACME challenges
# keep working.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Deny all attempts to access hidden files such as .htaccess, .htpasswd.
# Keep logging the requests to parse later
# (or to pass to firewall utilities such as fail2ban).
location ~ /\.ht {
    deny all;
    log_not_found off;
    return 404;
}

# Deny all attempts to access error and access log file.
location ~ /(error|access)\_log$ { 
    deny all;
    log_not_found off;
    return 404;
}

# Deny all attempts to access git directory.
location ~ /\.(git|gitignore)$ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny all attempts to access tmp directory.
location ~ ^/tmp/ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny all direct access to framework directory.
location ~* ^/(app|application)/ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny access to PHP composer's file inside vendor directory.
location ~* /vendor/.*\.php$ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny access to yml, twig, markdown, init file access.
location ~* /(.*)\.(?:markdown|md|twig|yaml|yml|ini|log)$ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny access to all packages manager file, such as grunt or composer file.
location ~* /(Gruntfile|package|composer)\.(js|json|lock)$ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny access to backup, dump and editor swap files. These are commonly left
# in web roots by deployments and editors and can leak source code or data.
location ~* \.(?:bak|backup|old|orig|original|save|swp|swo|tmp|temp|sql|sqlite|db|dump)$ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny PHP session files. save_path is admin-locked, but a misconfigured
# application could still write sessions into a web root.
location ~* /sess_[a-zA-Z0-9,-]+$ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny downloadable archives when DENY_ARCHIVE_FILES=true in .env.
#include /etc/nginx/includes/rules_archives.conf;

# Don't allow direct access to PHP files in the uploads directory.
# Works in sub-directory installs and also in multisite network.
# Keep logging the requests to parse later
# (or to pass to firewall utilities such as fail2ban).
location ~* /(?:uploads|files)/.*\.php$ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny access to PHP file in site files directory.
location ~ ^/sites/[^/]+/files/.*\.php$ {
    deny all;
    log_not_found off;
    return 404;
}

location ~ ^/sites/.*/private/ {
    deny all;
    log_not_found off;
    return 404;
}

# Deny access to WordPress-related stuff.
location ~* /(changelog|license|readme)\.(html|txt|rst|md)$ {
    deny all;
    log_not_found off;
    return 404;
}

location ~ /wp-config.php {
    deny all;
    log_not_found off;
    return 404;
}

location ~* /wp-content/backup-db/ {
    deny all;
    log_not_found off;
    return 404;
}

## You may add your own access rules and restrictions below this line...
