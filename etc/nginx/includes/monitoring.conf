## Local-only Nginx and PHP-FPM monitoring endpoints.
# Designed for a server{} block. The calling vhost must set $php_version
# before including this file, for example via php_handlers.conf.

# Nginx basic status.
location = /nginx_status {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    stub_status;
    access_log off;
    log_not_found off;
}

# PHP-FPM status and ping.
location ~ ^/php-fpm_(status|ping)$ {
    allow 127.0.0.1;
    allow ::1;
    deny all;

    include /etc/nginx/fastcgi_params;
    fastcgi_pass unix:/run/php/php$php_version-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $fastcgi_script_name;
    access_log off;
    log_not_found off;
}
