## Standard PHP-FPM handlers for the shipped and generated vhosts.
#
# Include this file in a server{} block after selecting the default release:
#
#   set $php_version "8.5";
#   include /etc/nginx/includes/php_handlers.conf;
#
# Versioned extensions (.php85, .php84, ...) override $php_version for their
# own location, so a single vhost can route files to different FPM pools.
# Include the file again inside a prefix location to inherit that location's
# access rules (for example the basic-auth protected /lcp area).

# Default handler, uses the server-level $php_version.
location ~ \.php$ {
    include /etc/nginx/includes/php_handler.conf;
}

# Versioned handlers.
location ~ \.php85$ {
    set $php_version "8.5";
    include /etc/nginx/includes/php_handler.conf;
}

location ~ \.php84$ {
    set $php_version "8.4";
    include /etc/nginx/includes/php_handler.conf;
}

location ~ \.php83$ {
    set $php_version "8.3";
    include /etc/nginx/includes/php_handler.conf;
}

location ~ \.php82$ {
    set $php_version "8.2";
    include /etc/nginx/includes/php_handler.conf;
}
