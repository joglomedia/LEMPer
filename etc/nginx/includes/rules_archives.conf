## Deny downloadable archives left in web roots.
#
# Deployments often leave release tarballs or database exports next to the
# application, where they are downloadable. Enable with DENY_ARCHIVE_FILES=true
# in .env (the installer uncomments the include in rules_restriction.conf).
#
# Note: some sites intentionally publish archives. Keep this disabled unless
# your applications do not serve .zip/.tar.gz files directly.

location ~* \.(?:zip|tar|tgz|gz|bz2|xz|7z|rar|iso|dmg|pkg)$ {
    deny all;
    log_not_found off;
    return 404;
}
