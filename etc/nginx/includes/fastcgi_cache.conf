## FastCGI cache.
# Designed to be included in any server, location block.

# A location-level add_header replaces inherited headers, so re-apply the
# security headers here whenever the cache location is enabled.
include /etc/nginx/includes/security_headers.conf;

# TODO: move fastcgi_cache to vhost config directly (for multi vhost cache path key).
fastcgi_cache LEMPERCACHE;

fastcgi_cache_background_update on;
fastcgi_cache_valid 200 60m;
fastcgi_cache_valid 301 302 10m;
#fastcgi_cache_valid 404 10m;
fastcgi_cache_min_uses 1;
fastcgi_cache_lock on;

fastcgi_cache_bypass $skip_cache $skip_cache_control $is_mobile;
fastcgi_cache_bypass $http_pragma $http_authorization;
fastcgi_no_cache $skip_cache $skip_cache_control $is_mobile;
fastcgi_no_cache $http_pragma $http_authorization;

# Purging is handled by includes/rules_fastcgi_cache.conf (purge locations),
# which requires the ngx_cache_purge module. Keep this file free of module
# directives so sites can enable caching without the purge module.

# Respect the application's Cache-Control and Set-Cookie headers, and never
# ignore Vary (ignoring it can serve the wrong representation).
# Only Expires/X-Accel-Expires are ignored so the TTLs above stay in control.
fastcgi_ignore_headers Expires X-Accel-Expires;

# Designed to be used with Nginx Cache Controller WP plugin
#fastcgi_pass_header "X-Accel-Redirect";
#fastcgi_pass_header "X-Accel-Expires";

# Header status
add_header X-FastCGI-Cache $upstream_cache_status always;
